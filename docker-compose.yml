services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facevision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facevision}
      POSTGRES_DB: ${POSTGRES_DB:-facevision}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facevision} -d ${POSTGRES_DB:-facevision}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-facevision}:${POSTGRES_PASSWORD:-facevision}@db:5432/${POSTGRES_DB:-facevision}
      JWT_SECRET: ${JWT_SECRET:-insecure-dev-secret-change-me}
      CAMERA_SECRET_KEY: ${CAMERA_SECRET_KEY:-insecure-camera-secret-change-me}
      SNAPSHOT_DIR: /app/storage/snapshots
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_DETECTIONS_TOPIC: detections
    volumes:
      - snapshots:/app/storage/snapshots
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker.events_consumer"]
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-facevision}:${POSTGRES_PASSWORD:-facevision}@db:5432/${POSTGRES_DB:-facevision}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_DETECTIONS_TOPIC: detections
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-detection-events-consumer}
      DETECTION_DEBOUNCE_SECONDS: ${DETECTION_DEBOUNCE_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: facevision-dev-cluster
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: facevision
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
  snapshots:
  kafka_data:
