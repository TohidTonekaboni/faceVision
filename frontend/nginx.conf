server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html has no content hash in its name, so without an explicit
    # directive browsers may heuristically cache it and keep running an old
    # JS bundle indefinitely after a rebuild, with no visible error — always
    # revalidate it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashes every built asset filename, so a stale cached copy
    # of one is harmless — a new build simply references a new filename.
    # Safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
